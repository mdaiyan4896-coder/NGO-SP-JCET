<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230EA47A'/%3E%3Cstop offset='100%25' stop-color='%2314B8A6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5 9.5-10' stroke='white' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M16 8.5c1.5-2 4-2 5.5-.5s1.5 4 0 5.5l-5.5 5.5' stroke='%23FF7A59' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VolunEase — Where Helping Hands Find Their Place | Volunteer Management System for NGOs</title>
    <meta name="description" content="VolunEase is a modern, intuitive volunteer management platform for NGOs. Streamline volunteer onboarding, smart event scheduling, real-time QR attendance, impact reporting, and AI-powered coordinator tools." />
    <meta name="theme-color" content="#0EA47A" />

    <!-- Google Fonts: Plus Jakarta Sans (Headings), Outfit (Accents), Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Script: restores theme, 100+ colors & language direction immediately before paint -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('voluneease-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var activeTheme = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', activeTheme);
          if (activeTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var savedColor = localStorage.getItem('voluneease-color-accent');
          if (savedColor) {
            document.documentElement.style.setProperty('--accent-primary', savedColor);
            document.documentElement.style.setProperty('--border-highlight', savedColor);
          }

          var savedLang = localStorage.getItem('voluneease-language-code');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang);
            if (['ar', 'ur', 'he', 'fa', 'ps', 'sd', 'yi'].indexOf(savedLang) !== -1) {
              document.documentElement.setAttribute('dir', 'rtl');
            }
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Hide Google translate top banner if injected */
      .goog-te-banner-frame.skiptranslate,
      .goog-te-gadget-simple,
      #goog-gt-tt,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      body {
        top: 0px !important;
      }
    </style>
  </head>
  <body class="bg-base text-base-content antialiased selection:bg-teal-500/20 selection:text-teal-600 transition-colors duration-200">
    <div id="root"></div>
    <div id="google_translate_element" style="display: none;"></div>
    <script>
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
